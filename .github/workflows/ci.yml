name: API CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: API lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
  tests:
    name: API tests
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab04
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wishlist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab04 -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: lab04
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_NAME: wishlist_test
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-signing-key
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v
